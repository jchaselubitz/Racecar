contractVersion: '27'
componentType: rest-consumer
componentKey: racecar
label: 'Racecar Overlord Gateway'
description: 'Long-lived Racecar gateway that claims Overlord runner work over the plain /api/runner/* surface and drives the mission lifecycle remotely via the ovld protocol subprocess (no vendored virtual-target client).'
restConsumer:
  authMechanisms: [bearer-token]
  vendoredContractPath: packages/gateway/src/overlord-runner-contract.ts
  endpoints:
    - { method: POST, path: /api/runner/claim, responseType: RunnerClaimResponse }
    - { method: POST, path: /api/runner/requests/:id/launching }
    - { method: POST, path: /api/runner/requests/:id/launched }
    - { method: POST, path: /api/runner/requests/:id/failed, requestBodyType: RunnerFailureBody }
    - { method: GET, path: /api/runner/status, responseType: RunnerQueueStatus }
  exportedTypes: [RunnerClaim, RunnerClaimResponse, RunnerQueueStatus, RunnerFailureBody]
